# Steady-state per-call latency — append-only (ROADMAP A9; ADR-0209 D2).
#
# Nanoseconds, not the `mean_ms` of history.yaml. A 10 ns call has no
# significant digits left in milliseconds. Separate file for the same reason
# size_history.yaml and skip_impl_history.yaml are separate: a different
# measurement with a different schema does not belong in history.yaml's rows.
#
# What this measures that history.yaml cannot: history.yaml drives `hyperfine`
# over whole processes, which is one guest invocation per process, so any cost
# paid on EVERY call is paid once there and disappears into process startup.
# D-584 and D-585 were both invisible to that harness by construction.
#
# Append with:
#   bash scripts/record_latency_bench.sh --reason "<tag>: <gist>"
#
# Absolute values move with machine state — 7% between two rounds on one host
# during the ADR-0209 investigation, and more on a laptop. Read `jit_over_interp`
# and the shape across trips before reading the nanoseconds. There is no
# threshold gate on this file; it is a record for human review.
#
# Schema:
#   date, commit, reason        provenance
#   arch, samples               conditions
#   engine_build_mode           the mode the ENGINE was built with. NOT the same
#                               as the runner's: build.zig floors the engine at
#                               ReleaseSafe when the caller asks for Debug, so a
#                               row reporting the runner's mode would state
#                               conditions that never held
#   runner_build_mode           the harness program's own mode
#   stack_limit_query_ns        the per-invocation cost D-584 tracks, on its own
#                               so a regression in it is distinguishable from a
#                               regression in the engine
#   calls[]                     per trip count: trips, wasm_insns, interp_ns,
#                               jit_ns, jit_over_interp
#
# Every *_ns figure is the MEDIAN of 5 samples and carries `_min` / `_max`
# siblings. Read the median; read the spread to decide whether the median means
# anything. A row whose min and max straddle it widely was taken on a busy
# machine and should not be compared against a quiet one.
#
# The spread only covers variation WITHIN one process. Anything that slows the
# whole process uniformly — core placement, thermal state, background load —
# leaves all five samples equally slow and min/max equally tight, so the row
# looks tidy and is wrong.
#
# In practice the first run on a host is the one to distrust: an opening
# aarch64-macos run read 2.2x the value the next three settled on. Take at
# least two runs and compare them. A single row is never self-validating.



