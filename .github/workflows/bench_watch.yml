# bench_watch — nightly gross-regression detector (ADR-0211 D2).
#
# Runs scripts/bench_watch.sh on the two timing arches (ADR-0137 scope):
# same-run A/B of HEAD vs the latest v* release tag, 5-fixture canary set,
# alert at >= 2.0x slower on >= 2 fixtures. NOT a gate: no PR association,
# `ci-required` untouched; the exit-1 on breach exists because a failed
# scheduled run is GitHub's notification channel (it emails the user who
# last modified the cron line below). Details land in the run's step
# summary; nothing is committed — bench/results/history.yaml stays curated
# and local-host-only (its arch-only labels cannot distinguish hosted
# runners from maintainer hosts).
#
# Known limit: GitHub auto-disables scheduled workflows after 60 days
# without repo activity — the watch stops silently. Acceptable for a
# maintained repo (any push resets the clock); re-enable from the Actions
# tab if it happens.

name: bench_watch

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench_watch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watch:
    name: watch (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64-macos
            runs-on: macos-15
            zig-arch: aarch64-macos
          - name: x86_64-linux
            runs-on: ubuntu-22.04
            zig-arch: x86_64-linux
    steps:
      - name: Checkout (full history — the base tag and worktree need it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read tool versions
        shell: bash
        run: |
          set -euo pipefail
          source .github/versions.lock
          echo "ZIG_VERSION=${ZIG_VERSION}" >> "$GITHUB_ENV"

      # Same dep-store cache as ci.yml — zlinter is an eager dep, so both
      # builds resolve it; the cache removes the per-run network fetch.
      - name: Cache Zig package deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-pkg
          key: zig-pkg-${{ matrix.name }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-pkg-${{ matrix.name }}-

      - name: Cache Zig
        id: cache-zig
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/zig-${{ env.ZIG_VERSION }}
          key: zig-${{ env.ZIG_VERSION }}-${{ matrix.name }}

      - name: Install Zig
        if: steps.cache-zig.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          dir="zig-${{ matrix.zig-arch }}-${ZIG_VERSION}"
          mkdir -p ~/.local
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${dir}.tar.xz" -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C ~/.local
          mv "$HOME/.local/${dir}" "$HOME/.local/zig-${ZIG_VERSION}"

      - name: Add Zig to PATH
        shell: bash
        run: echo "$HOME/.local/zig-${ZIG_VERSION}" >> "$GITHUB_PATH"

      # Build-time dependency, not a bench tool: the DEFAULT `zig build` install
      # set includes the spec-assert exes, which run `wasm-tools parse` to make
      # spectest.wasm from test/spec/spectest.wat (build.zig). bench_watch.sh
      # builds HEAD and the base tag with a plain `zig build`, so without this
      # both builds die before a single fixture is timed. Same install as
      # ci.yml / release.yml, version from versions.lock.
      - name: Install wasm-tools (build-time, required by the default install set)
        shell: bash
        run: |
          set -euo pipefail
          source .github/versions.lock
          v="${WASM_TOOLS_VERSION}"
          case "${{ runner.os }}" in
            Linux)  asset="wasm-tools-${v}-x86_64-linux" ;;
            macOS)  asset="wasm-tools-${v}-aarch64-macos" ;;
          esac
          url="https://github.com/bytecodealliance/wasm-tools/releases/download/v${v}/${asset}.tar.gz"
          mkdir -p "$HOME/.local/bin"
          cd "$HOME/.local/bin"
          curl -fsSL "$url" -o wt.tar.gz
          tar -xzf wt.tar.gz --strip-components=1 "${asset}/wasm-tools"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Pinned release binary, NOT the distro package: Ubuntu 22.04's apt
      # ships hyperfine 1.12.0, and bench_watch.sh's load-bearing `-N` flag
      # needs 1.13+. The pin mirrors the flake's dev-shell version via
      # versions.lock, same pattern as ci.yml's wasmtime/wasm-tools installs.
      - name: Install hyperfine
        shell: bash
        run: |
          set -euo pipefail
          source .github/versions.lock
          v="${HYPERFINE_VERSION}"
          case "${{ runner.os }}" in
            Linux)  asset="hyperfine-v${v}-x86_64-unknown-linux-gnu" ;;
            macOS)  asset="hyperfine-v${v}-aarch64-apple-darwin" ;;
          esac
          url="https://github.com/sharkdp/hyperfine/releases/download/v${v}/${asset}.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "$url" -o /tmp/hf.tar.gz
          tar -xzf /tmp/hf.tar.gz -C /tmp
          mv "/tmp/${asset}/hyperfine" "$HOME/.local/bin/hyperfine"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        shell: bash
        run: |
          zig version
          wasm-tools --version
          hyperfine --version
          jq --version

      - name: bench_watch.sh
        shell: bash
        run: bash scripts/bench_watch.sh
